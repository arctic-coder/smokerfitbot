[tool.ruff]
target-version = "py310"
line-length = 120
src = ["."]
exclude = ["scripts/", ".git/"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument (common in aiogram)
    "RUF001", # ambiguous unicode (Russian text)
    "RUF002", # ambiguous unicode in docstrings
    "RUF003", # ambiguous unicode in comments
    "RUF046", # false positive: int(round(float(str) * 100)) chain from Yookassa SDK
]

[tool.ruff.lint.isort]
known-first-party = [
    "config", "db", "states", "keyboards", "texts", "utils",
    "handlers", "billing", "jobs", "web", "logging_setup",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
